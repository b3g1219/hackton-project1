<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="contact.css">
</head>

<body>

    <header>

        <h1>NorthernStar Restaurant</h1>

        <nav class="home">
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="menupage.html">Menu</a></li>
                <li><a href="aboutUs.html">About Us</a></li>
                <li><a href="#contact">Contact Us</a></li>
            </ul>
        </nav>

    </header>

    <div class="container">

        <div class="card">

            <div class="element">

                <h2>Contact Us</h2>

                <p class="text">
                    We would love to hear from you. Send your message and our team
                    will contact you as soon as possible.
                </p>

                <form>

                    <div class="input">

                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Pulse">

                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="pulse@gmail.com">

                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" name="phone" placeholder="0914223456">

                        <label for="messagebox">Message</label>
                        <textarea name="messagebox" id="messagebox" rows="5"></textarea>

                        <button type="submit">Submit</button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</body>

<footer class="footer">


    <p>Email: NorthernStar@gmail.com</p>
    <p>© 2026 NorthernStar Restaurant. All Rights Reserved.</p>

</footer>

</html>
